<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USB Screen Mirror</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #controls { text-align: center; margin-bottom: 20px; }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:hover { background-color: #218838; }
        #mirror-canvas {
            max-width: 90vw;
            max-height: 80vh;
            border: 4px solid #333;
            background: #000;
            border-radius: 12px;
            display: none;
        }
        .status { color: #aaa; margin-top: 10px; font-size: 14px; max-width: 400px; line-height: 1.4; }
    </style>
</head>
<body>

    <div id="controls">
        <h1>🔌 USB Phone Mirror</h1>
        <p>Connect your phone via USB with USB Debugging enabled.</p>
        <button id="connect-btn">Connect & Mirror Phone</button>
        <div class="status" id="status-text">Status: Disconnected</div>
    </div>

    <canvas id="mirror-canvas"></canvas>

    <script>
        const connectBtn = document.getElementById('connect-btn');
        const statusText = document.getElementById('status-text');
        const canvas = document.getElementById('mirror-canvas');
        const ctx = canvas.getContext('2d');
        let streaming = false;
        let webusb;
        let adb;

        // Custom function to forcefully attempt connection handles up to 5 times
        async function robustConnect(maxRetries = 5) {
            for (let i = 1; i <= maxRetries; i++) {
                try {
                    statusText.innerText = `Status: Claiming device interface (Attempt ${i}/${maxRetries})...`;
                    webusb = await window.Adb.open("WebUSB");
                    adb = await webusb.connectAdb("host::");
                    return true; // Connection successful!
                } catch (err) {
                    console.warn(`Attempt ${i} failed:`, err.message);
                    if (i === maxRetries) throw err;
                    // Wait 1.5 seconds before trying to intercept the pipe again
                    await new Promise(r => setTimeout(r, 1500));
                }
            }
            return false;
        }

        connectBtn.addEventListener('click', async () => {
            if (streaming) return;

            if (typeof window.Adb === 'undefined') {
                statusText.innerText = "Error: System engine failure. Use Chrome or Edge.";
                return;
            }

            try {
                // Step 1: Open the hardware window picker
                statusText.innerText = "Status: Please select your device in the browser window popup...";
                
                // Step 2: Fire the robust loop system to bypass system driver locking
                await robustConnect(5);

                statusText.innerText = "Status: Connecting success! Mirroring active.";
                canvas.style.display = 'block';
                streaming = true;
                connectBtn.style.display = 'none';

                // Stream frame acquisition loop
                while (streaming) {
                    let shell = await adb.shell("screencap -p");
                    let output = await shell.receive();
                    
                    if (output && output.data) {
                        const blob = new Blob([output.data], { type: 'image/png' });
                        const bitmap = await createImageBitmap(blob);
                        
                        canvas.width = bitmap.width;
                        canvas.height = bitmap.height;
                        ctx.drawImage(bitmap, 0, 0);
                        bitmap.close(); 
                    }
                    await new Promise(r => setTimeout(r, 60)); 
                }

            } catch (err) {
                console.error(err);
                statusText.innerText = "Error: System blocked by OS. Fix: Unplug the cable, flip your phone's USB connection mode setting to 'MIDI' or 'PTP', and plug it back in.";
            }
        });
    </script>
</body>
</html>
