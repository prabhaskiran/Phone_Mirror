<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USB Screen Mirror</title>
    <!-- Importing modern ES modules for the ADB interface -->
    <script type="module">
        import { Adb } from 'https://jsdelivr.net';
        import { AdbWebUsbBackend } from 'https://jsdelivr.net';
        
        // Attach them directly to the window so our main button logic can see them
        window.Adb = Adb;
        window.AdbWebUsbBackend = AdbWebUsbBackend;
    </script>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #controls { text-align: center; margin-bottom: 20px; }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:hover { background-color: #218838; }
        #mirror-canvas {
            max-width: 90vw;
            max-height: 80vh;
            border: 4px solid #333;
            background: #000;
            border-radius: 12px;
            display: none;
        }
        .status { color: #aaa; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <div id="controls">
        <h1>🔌 USB Phone Mirror</h1>
        <p>Connect your phone via USB with USB Debugging enabled.</p>
        <button id="connect-btn">Connect & Mirror Phone</button>
        <div class="status" id="status-text">Status: Disconnected</div>
    </div>

    <canvas id="mirror-canvas"></canvas>

    <script>
        const connectBtn = document.getElementById('connect-btn');
        const statusText = document.getElementById('status-text');
        const canvas = document.getElementById('mirror-canvas');
        const ctx = canvas.getContext('2d');
        let streaming = false;

        connectBtn.addEventListener('click', async () => {
            if (streaming) return;

            // Simple fail-safe to let modules finish loading
            if (!window.AdbWebUsbBackend || !window.Adb) {
                statusText.innerText = "Status: Initializing scripts... Click again in 2 seconds.";
                return;
            }

            try {
                statusText.innerText = "Status: Requesting USB device access...";
                
                // 1. Prompt browser to request the USB device interface
                const device = await window.AdbWebUsbBackend.requestDevice();
                if (!device) {
                    statusText.innerText = "Status: No device selected.";
                    return;
                }

                statusText.innerText = "Status: Authenticating ADB key protocol...";
                const backend = new window.AdbWebUsbBackend(device);
                const adb = await window.Adb.authenticate(backend, {
                    generateKeyPair: () => window.Adb.generateKeyPair()
                });

                statusText.innerText = "Status: Mirroring active! Accept prompts on your phone.";
                canvas.style.display = 'block';
                streaming = true;
                connectBtn.style.display = 'none';

                // 2. Continual screenshot frame extraction loop
                while (streaming) {
                    const output = await adb.subprocess.spawn('exec-out screencap -p');
                    let chunks = [];
                    const reader = output.stdout.getReader();
                    
                    while (true) {
                        const { value, done } = await reader.read();
                        if (value) chunks.push(value);
                        if (done) break;
                    }

                    const blob = new Blob(chunks, { type: 'image/png' });
                    const bitmap = await createImageBitmap(blob);
                    
                    canvas.width = bitmap.width;
                    canvas.height = bitmap.height;
                    ctx.drawImage(bitmap, 0, 0);
                    bitmap.close(); 
                    
                    // Controlled delay interval (30ms = ~30 FPS)
                    await new Promise(r => setTimeout(r, 30)); 
                }

            } catch (err) {
                console.error(err);
                statusText.innerText = "Error: " + err.message;
            }
        });
    </script>
</body>
</html>
