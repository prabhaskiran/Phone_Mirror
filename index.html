<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USB Screen Mirror</title>
    <!-- Include the essential WebUSB / WebADB components -->
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #controls { text-align: center; margin-bottom: 20px; }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:hover { background-color: #218838; }
        #mirror-canvas {
            max-width: 90vw;
            max-height: 80vh;
            border: 4px solid #333;
            background: #000;
            border-radius: 12px;
            display: none;
        }
        .status { color: #aaa; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <div id="controls">
        <h1>🔌 USB Phone Mirror</h1>
        <p>Connect your phone via USB with USB Debugging enabled.</p>
        <button id="connect-btn">Connect & Mirror Phone</button>
        <div class="status" id="status-text">Status: Disconnected</div>
    </div>

    <!-- The container where your phone screen canvas will draw -->
    <canvas id="mirror-canvas"></canvas>

    <script>
        const connectBtn = document.getElementById('connect-btn');
        const statusText = document.getElementById('status-text');
        const canvas = document.getElementById('mirror-canvas');
        const ctx = canvas.getContext('2d');
        let streaming = false;

        connectBtn.addEventListener('click', async () => {
            if (streaming) return;

            try {
                statusText.innerText = "Status: Requesting USB access...";
                
                // 1. Request access to the USB device from the browser
                const device = await window.AdbBackendWebUsb.AdbWebUsbBackend.requestDevice();
                if (!device) {
                    statusText.innerText = "Status: No device selected.";
                    return;
                }

                statusText.innerText = "Status: Connecting to ADB protocol...";
                const backend = new window.AdbBackendWebUsb.AdbWebUsbBackend(device);
                const adb = await window.Adb.Adb.authenticate(backend, {
                    // Generates the cryptographic key pair required to authenticate with Android ADB
                    generateKeyPair: () => {
                        return window.Adb.Adb.generateKeyPair();
                    }
                });

                statusText.innerText = "Status: Mirroring started! Check your phone to allow access.";
                canvas.style.display = 'block';
                streaming = true;
                connectBtn.style.display = 'none';

                // 2. Loop frame requests via native ADB shell screencap commands
                // This fetches raw frame buffers directly through the physical USB pipe.
                while (streaming) {
                    const output = await adb.subprocess.spawn('exec-out screencap -p');
                    let chunks = [];
                    
                    // Read the incoming binary stream of the screenshot
                    const reader = output.stdout.getReader();
                    while (true) {
                        const { value, done } = await reader.read();
                        if (value) chunks.push(value);
                        if (done) break;
                    }

                    // Convert raw binary chunks to a viewable browser image blob
                    const blob = new Blob(chunks, { type: 'image/png' });
                    const bitmap = await createImageBitmap(blob);
                    
                    // Resize canvas to match phone aspect ratio dynamically
                    canvas.width = bitmap.width;
                    canvas.height = bitmap.height;
                    
                    // Draw frame on canvas
                    ctx.drawImage(bitmap, 0, 0);
                    bitmap.close(); // Clean up memory leak
                    
                    // Short brief delay before pulling the next hardware frame
                    await new Promise(r => setTimeout(r, 30)); 
                }

            } catch (err) {
                console.error(err);
                statusText.innerText = "Error: " + err.message + ". Make sure USB Debugging is ON.";
            }
        });
    </script>
</body>
</html>
