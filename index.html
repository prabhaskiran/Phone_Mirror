<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USB Screen Mirror</title>
    <!-- Fully compiled minified build distribution library -->
    <script src="https://cdn.jsdelivr.net/npm/webadb@1.0.1/webadb.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #controls { text-align: center; margin-bottom: 20px; }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:hover { background-color: #218838; }
        #mirror-canvas {
            max-width: 90vw;
            max-height: 80vh;
            border: 4px solid #333;
            background: #000;
            border-radius: 12px;
            display: none;
        }
        .status { color: #aaa; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <div id="controls">
        <h1>🔌 USB Phone Mirror</h1>
        <p>Connect your phone via USB with USB Debugging enabled.</p>
        <button id="connect-btn">Connect & Mirror Phone</button>
        <div class="status" id="status-text">Status: Disconnected</div>
    </div>

    <canvas id="mirror-canvas"></canvas>

    <script>
        const connectBtn = document.getElementById('connect-btn');
        const statusText = document.getElementById('status-text');
        const canvas = document.getElementById('mirror-canvas');
        const ctx = canvas.getContext('2d');
        let streaming = false;
        let webusb;
        let adb;

        connectBtn.addEventListener('click', async () => {
            if (streaming) return;

            // Failsafe validator mapping for compilation architecture
            if (typeof window.Adb === 'undefined') {
                statusText.innerText = "Error: System engine failure. Make sure you are using Chrome or Edge.";
                return;
            }

            try {
                statusText.innerText = "Status: Spawning WebUSB Interface Connection...";
                
                // Open native WebUSB controller mapping
                webusb = await window.Adb.open("WebUSB");
                
                statusText.innerText = "Status: Authenticating ADB Host Connection...";
                // Connect with parameters required by WebUSB protocol
                adb = await webusb.connectAdb("host::");

                statusText.innerText = "Status: Mirroring active! Check your phone for authorization.";
                canvas.style.display = 'block';
                streaming = true;
                connectBtn.style.display = 'none';

                // Hardware level extraction routine loop
                while (streaming) {
                    let shell = await adb.shell("screencap -p");
                    let output = await shell.receive();
                    
                    if (output && output.data) {
                        const blob = new Blob([output.data], { type: 'image/png' });
                        const bitmap = await createImageBitmap(blob);
                        
                        canvas.width = bitmap.width;
                        canvas.height = bitmap.height;
                        ctx.drawImage(bitmap, 0, 0);
                        bitmap.close(); 
                    }
                    
                    // Throttled refresh layout to prevent phone hardware exhaustion
                    await new Promise(r => setTimeout(r, 60)); 
                }

            } catch (err) {
                console.error(err);
                statusText.innerText = "Error: " + err.message + ". Check connection and close native ADB apps.";
            }
        });
    </script>
</body>
</html>
