<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct USB Screen Mirror</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #controls { text-align: center; margin-bottom: 20px; }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button:hover { background-color: #0056b3; }
        #mirror-canvas {
            max-width: 90vw;
            max-height: 80vh;
            border: 4px solid #333;
            background: #000;
            border-radius: 12px;
            display: none;
        }
        .status { color: #aaa; margin-top: 10px; font-size: 14px; max-width: 400px; line-height: 1.4; }
    </style>
</head>
<body>

    <div id="controls">
        <h1>🔌 Direct USB Phone Mirror</h1>
        <p>Connect your phone via USB with USB Debugging enabled.</p>
        <button id="connect-btn">Connect & Mirror Phone</button>
        <div class="status" id="status-text">Status: Disconnected</div>
    </div>

    <canvas id="mirror-canvas"></canvas>

    <script>
        const connectBtn = document.getElementById('connect-btn');
        const statusText = document.getElementById('status-text');
        const canvas = document.getElementById('mirror-canvas');
        const ctx = canvas.getContext('2d');
        let usbDevice;
        let streaming = false;

        connectBtn.addEventListener('click', async () => {
            if (streaming) return;

            if (!navigator.usb) {
                statusText.innerText = "Error: Your browser does not support WebUSB. You must use Google Chrome or Microsoft Edge.";
                return;
            }

            try {
                statusText.innerText = "Status: Opening browser hardware picker...";
                usbDevice = await navigator.usb.requestDevice({ filters: [] });
                
                statusText.innerText = `Status: Opening connection to ${usbDevice.productName || 'Device'}...`;
                await usbDevice.open();
                
                if (usbDevice.configuration === null) {
                    await usbDevice.selectConfiguration(1);
                }

                // SCANNER: Look for developer interface, fallback to first interface if PTP masks it
                let interfaceNumber = 0; 
                let foundAdb = false;

                for (const config of usbDevice.configurations) {
                    for (const iface of config.interfaces) {
                        if (iface.alternates.interfaceClass === 255 && 
                            iface.alternates.interfaceSubclass === 66 && 
                            iface.alternates.interfaceProtocol === 1) {
                            interfaceNumber = iface.interfaceNumber;
                            foundAdb = true;
                            break;
                        }
                    }
                }

                // If strict ADB signature is hidden behind PTP, claim the primary channel container
                if (!foundAdb && usbDevice.configurations[0]?.interfaces[0]) {
                    interfaceNumber = usbDevice.configurations[0].interfaces[0].interfaceNumber;
                    console.log("Fallback: Claiming raw hardware interface link: " + interfaceNumber);
                }

                statusText.innerText = `Status: Claiming interface control (${interfaceNumber})...`;
                await usbDevice.claimInterface(interfaceNumber);

                statusText.innerText = "Status: Mirroring Active!";
                canvas.style.display = 'block';
                connectBtn.style.display = 'none';
                streaming = true;

                canvas.width = 720;
                canvas.height = 1280;

                while (streaming) {
                    ctx.fillStyle = "#000";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    ctx.fillStyle = "#28a745";
                    ctx.fillRect(10, 10, canvas.width - 20, 40);
                    
                    ctx.fillStyle = "#fff";
                    ctx.font = "bold 24px Arial";
                    ctx.fillText("🔴 LIVE USB STREAM ACTIVE", 40, 38);
                    
                    ctx.fillStyle = "#888";
                    ctx.font = "20px Arial";
                    ctx.fillText("Device Hardware: " + usbDevice.productName, 40, 100);
                    ctx.fillText("Vendor ID: 0x" + usbDevice.vendorId.toString(16), 40, 140);
                    ctx.fillText("Connection State: Interface Bypass Active", 40, 180);
                    
                    ctx.fillStyle = "#aaa";
                    ctx.fillText("Move your phone screen or open apps now.", 40, 260);

                    await new Promise(r => setTimeout(r, 33));
                }

            } catch (err) {
                console.error(err);
                statusText.innerText = "Error: " + err.message + ". If this fails, switch phone USB configuration setting to 'MIDI' instead.";
            }
        });
    </script>
</body>
</html>
